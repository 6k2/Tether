[package]
name = "tether"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Native SSH + SFTP workspace: split terminals and a pipelined SFTP engine in one window"
license = "MIT"
readme = "README.md"
repository = "https://github.com/izLoki/Tether"
keywords = ["ssh", "sftp", "terminal", "egui"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["syntect"] }
egui_dock = { version = "0.21.1", features = ["serde"] }
futures = "0.3"
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.17.2"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
semver = "1"
sha2 = "0.11"
ssh-key = { version = "=0.7.0-rc.11", features = ["getrandom", "rsa", "ed25519", "encryption"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
vt100 = "0.16.2"
zeroize = "1"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
embed-resource = "3"
